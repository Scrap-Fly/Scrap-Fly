<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrap and Fly - Mundo Abierto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 14px 18px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            min-width: 240px;
        }

        .hud-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .stat-bar {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            margin-top: 6px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 0.2s ease;
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #cbd5e1;
            pointer-events: none;
            backdrop-filter: blur(6px);
            text-align: center;
        }

        #action-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(56, 189, 248, 0.9);
            color: #030712;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            display: none;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            pointer-events: none;
        }

        #location-banner {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 20px;
            border-radius: 12px;
            text-align: right;
            backdrop-filter: blur(6px);
        }

        #planet-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-overlay">
        <div class="hud-card">
            <div class="hud-title">Modo Actual</div>
            <div class="hud-value" id="mode-text">A pie (Astronauta)</div>
        </div>

        <div class="hud-card">
            <div class="hud-title">Piezas de Chatarra</div>
            <div class="hud-value" id="scrap-count">0</div>
        </div>

        <div class="hud-card">
            <div class="hud-title">Nivel de Nave</div>
            <div class="hud-value" id="ship-level">Nivel 1 (Motor Básico)</div>
            <div class="stat-bar"><div class="stat-fill" id="upgrade-bar"></div></div>
        </div>
    </div>

    <div id="location-banner">
        <div class="hud-title">Ubicación</div>
        <div id="planet-name">Planeta Inicial</div>
    </div>

    <div id="action-prompt" id="prompt">Presiona E para entrar/salir de la nave</div>

    <div id="controls-hint">
        <b>Moverse:</b> W/A/S/D o Flechas | <b>Entrar/Salir de Nave:</b> E | Busca piezas a pie para mejorar tu nave e ir a planetas lejanos.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const WORLD_SIZE = 8000;

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyE') toggleMount();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Estado del juego
        let inShip = false;

        // Jugador (Astronauta)
        const player = {
            x: WORLD_SIZE / 2 + 50,
            y: WORLD_SIZE / 2,
            vx: 0,
            vy: 0,
            speed: 3,
            size: 10,
            scrap: 0
        };

        // Nave
        const ship = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            vx: 0,
            vy: 0,
            angle: 0,
            baseSpeed: 0.25,
            maxSpeed: 5,
            friction: 0.98,
            level: 1,
            nextUpgrade: 5
        };

        // Estrellas
        const stars = [];
        for (let i = 0; i < 1000; i++) {
            stars.push({
                x: Math.random() * WORLD_SIZE,
                y: Math.random() * WORLD_SIZE,
                size: Math.random() * 2 + 0.5
            });
        }

        // Planetas con requerimientos de nivel de nave
        const planets = [
            { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2, radius: 300, color: '#3b82f6', name: 'Planeta Inicial (Astra)', reqLevel: 1 },
            { x: WORLD_SIZE / 2 - 2000, y: WORLD_SIZE / 2 - 1800, radius: 250, color: '#ef4444', name: 'Planeta Rojo (Pyros)', reqLevel: 2 },
            { x: WORLD_SIZE / 2 + 2500, y: WORLD_SIZE / 2 - 2000, radius: 320, color: '#10b981', name: 'Planeta Selvático (Gaia)', reqLevel: 3 },
            { x: WORLD_SIZE / 2 + 2000, y: WORLD_SIZE / 2 + 2200, radius: 280, color: '#f59e0b', name: 'Planeta Dorado (Aurelia)', reqLevel: 4 }
        ];

        // Piezas de chatarra
        const scraps = [];
        function spawnScrap(count) {
            for (let i = 0; i < count; i++) {
                scraps.push({
                    x: Math.random() * (WORLD_SIZE - 400) + 200,
                    y: Math.random() * (WORLD_SIZE - 400) + 200,
                    size: 8,
                    value: 1
                });
            }
        }
        spawnScrap(150);

        function toggleMount() {
            const dist = Math.hypot(player.x - ship.x, player.y - ship.y);
            if (!inShip && dist < 60) {
                inShip = true;
            } else if (inShip) {
                inShip = false;
                player.x = ship.x + 30;
                player.y = ship.y + 30;
            }
        }

        function update() {
            const actionPrompt = document.getElementById('action-prompt');

            if (inShip) {
                // Controlar Nave
                if (keys['ArrowUp'] || keys['KeyW']) {
                    ship.vx += Math.cos(ship.angle) * ship.baseSpeed;
                    ship.vy += Math.sin(ship.angle) * ship.baseSpeed;
                }
                if (keys['ArrowDown'] || keys['KeyS']) {
                    ship.vx -= Math.cos(ship.angle) * (ship.baseSpeed * 0.5);
                    ship.vy -= Math.sin(ship.angle) * (ship.baseSpeed * 0.5);
                }
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    ship.angle -= 0.05;
                }
                if (keys['ArrowRight'] || keys['KeyD']) {
                    ship.angle += 0.05;
                }

                ship.vx *= ship.friction;
                ship.vy *= ship.friction;

                ship.x += ship.vx;
                ship.y += ship.vy;

                // El jugador sigue a la nave cuando está dentro
                player.x = ship.x;
                player.y = ship.y;

                actionPrompt.style.display = 'none';
            } else {
                // Controlar Jugador a pie
                player.vx = 0;
                player.vy = 0;

                if (keys['ArrowUp'] || keys['KeyW']) player.vy = -player.speed;
                if (keys['ArrowDown'] || keys['KeyS']) player.vy = player.speed;
                if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -player.speed;
                if (keys['ArrowRight'] || keys['KeyD']) player.vx = player.speed;

                player.x += player.vx;
                player.y += player.vy;

                // Prompt para subir a la nave
                const distToShip = Math.hypot(player.x - ship.x, player.y - ship.y);
                if (distToShip < 60) {
                    actionPrompt.style.display = 'block';
                    actionPrompt.innerText = 'Presiona E para subir a la Nave';
                } else {
                    actionPrompt.style.display = 'none';
                }
            }

            // Recolectar Chatarra (tanto a pie como en nave)
            const targetX = inShip ? ship.x : player.x;
            const targetY = inShip ? ship.y : player.y;
            const pickupRadius = inShip ? 35 : 20;

            for (let i = scraps.length - 1; i >= 0; i--) {
                const dist = Math.hypot(targetX - scraps[i].x, targetY - scraps[i].y);
                if (dist < pickupRadius) {
                    scraps.splice(i, 1);
                    player.scrap++;

                    // Subir nivel de nave si hay suficientes piezas
                    if (player.scrap >= ship.nextUpgrade) {
                        ship.level++;
                        ship.baseSpeed += 0.08;
                        ship.maxSpeed += 1.5;
                        ship.nextUpgrade += ship.level * 5;
                    }
                    updateUI();
                }
            }

            // Detectar planeta actual
            let currentLoc = 'Espacio Profundo';
            planets.forEach(p => {
                const dist = Math.hypot(targetX - p.x, targetY - p.y);
                if (dist < p.radius + 100) {
                    if (ship.level >= p.reqLevel) {
                        currentLoc = p.name;
                    } else {
                        currentLoc = `${p.name} (Requiere Nave Nivel ${p.reqLevel})`;
                    }
                }
            });
            document.getElementById('planet-name').innerText = currentLoc;

            updateUI();
        }

        function updateUI() {
            document.getElementById('mode-text').innerText = inShip ? 'En Nave' : 'A pie (Astronauta)';
            document.getElementById('scrap-count').innerText = player.scrap;
            document.getElementById('ship-level').innerText = `Nivel ${ship.level}`;

            const prevGoal = ship.nextUpgrade - (ship.level * 5);
            const progress = ((player.scrap - prevGoal) / (ship.nextUpgrade - prevGoal)) * 100;
            document.getElementById('upgrade-bar').style.width = `${Math.min(100, Math.max(0, progress))}%`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const camX = inShip ? ship.x : player.x;
            const camY = inShip ? ship.y : player.y;

            ctx.save();
            ctx.translate(canvas.width / 2 - camX, canvas.height / 2 - camY);

            // Fondo Estrellas
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

            // Planetas
            planets.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Chatarra
            ctx.fillStyle = '#f59e0b';
            scraps.forEach(s => {
                ctx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
            });

            // Dibujar Nave
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            ctx.fillStyle = ship.level >= 2 ? '#38bdf8' : '#64748b';
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(-12, -10);
            ctx.lineTo(-12, 10);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Dibujar Jugador (si está fuera de la nave)
            if (!inShip) {
                ctx.fillStyle = '#f1f5f9';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Casco astronauta
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(player.x + 2, player.y - 1, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        updateUI();
        gameLoop();
    </script>
</body>
</html>
